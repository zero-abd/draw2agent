name: Publish to npm

# Publishes draw2agent to npm automatically whenever the "version" field in
# package.json changes on the main branch. Can also be run manually from the
# Actions tab (workflow_dispatch) — useful for publishing the first release.
#
# Authentication uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is
# needed. Configure the trusted publisher once on npmjs.com — see README.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      # Node 24's bundled npm (>= 11.5.1) already supports Trusted Publishing,
      # so no fragile in-place `npm install -g npm@latest` self-upgrade.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check whether this version is already published
        id: version
        run: |
          LOCAL="$(node -p "require('./package.json').version")"
          REMOTE="$(npm view draw2agent version 2>/dev/null || echo none)"
          echo "Local: $LOCAL — Published: $REMOTE"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::draw2agent@$LOCAL is already on npm — nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: |
          npm ci
          npm ci --prefix overlay

      # `npm publish` runs the prepublishOnly script, which builds both the
      # server and the overlay bundle.
      - name: Build and publish
        if: steps.version.outputs.changed == 'true'
        run: npm publish
